name: aurora
description: Aurora — lightweight SSH terminal for Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dartssh2: ^2.12.0
  xterm: ^4.0.0
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  path_provider: ^2.1.5
  file_picker: ^10.3.10
  # 与 server_box 相同：本机终端依赖真正的伪终端
  flutter_pty: ^0.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
